<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Services · Example Studio in Beirut, Lebanon</title>
    <meta
      name="description"
      content="Websites, online shops and booking apps for small businesses in Beirut, each at a fixed price agreed after a free first call."
    />
    <link rel="canonical" href="{{ORIGIN}}/services" />
    <link rel="icon" href="/share.png" />
    <meta property="og:title" content="Services" />
    <meta property="og:image" content="{{ORIGIN}}/share.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Example Studio",
        "url": "{{ORIGIN}}/",
        "telephone": "+961 1 000 000",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Hamra Street",
          "addressLocality": "Beirut",
          "addressCountry": "LB"
        },
        "geo": { "@type": "GeoCoordinates", "latitude": 33.8965, "longitude": 35.4823 },
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
          "opens": "09:00",
          "closes": "17:00"
        }
      }
    </script>
    <style>
      body { font-family: sans-serif; margin: 0; color: #222; }
      header, main { padding: 16px; }
      header a { display: inline-block; padding: 12px; }
      .hero { background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url(/photo.svg) center / cover; padding: 48px 16px; }
      .hero p { color: #fff; font-size: 18px; margin: 0; }
      .row { max-width: 640px; box-sizing: border-box; background: #f3f3f3; padding: 8px; }
      .icons a { display: inline-block; width: 28px; height: 28px; background: #333; margin-right: 12px; }
      small { font-size: 13px; }
      img.picture { max-width: 100%; height: auto; }
    </style>
  </head>
  <body>
    <header><a href="/">Example Studio</a></header>
    <main>
      <h1>Services</h1>
      <section class="hero"><p>Websites that open fast on every phone.</p></section>
      <div class="row">Websites · Online shops · Booking apps · Care and hosting</div>
      <p class="icons"><a href="/" aria-label="Home"></a><a href="/about" aria-label="About"></a></p>
      <img class="picture" src="/hero.svg" alt="A desk with a laptop" width="200" height="100" />
      <p><small>Prices in US dollars, before tax.</small></p>
      <p><a href="/">Back home</a></p>
    </main>
  </body>
</html>
