# Tests on every push and pull request: Node 22 and 24, with the Chrome that
# GitHub's Ubuntu runners have installed (the browser tests use it).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build
      # Node 22 runs the tests' TypeScript with type stripping switched on.
      - run: npm test
        env:
          NODE_OPTIONS: ${{ matrix.node == 22 && '--experimental-strip-types' || '' }}
      # The built server answers over stdio, as npx starts it.
      - run: node --test test/stdio.test.ts
        env:
          SD_ENTRY: dist/index.js
          NODE_OPTIONS: ${{ matrix.node == 22 && '--experimental-strip-types' || '' }}
